name: nayab_agreement_app
description: "Nayab Qist Point Agreement Generator Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  mobile_scanner: ^7.4.2
  pdf: ^3.13.1
  printing: ^5.15.1
  share_plus: ^13.3.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.6
  file_picker: ^13.3.0
  url_launcher: ^6.3.3
  archive: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # ایپ کے اندر فونٹ کے فولڈر کا اندراج
  assets:
    - assets/fonts/

  # جمیل نوری نستعلیق فونٹ
  fonts:
    - family: JameelNoori
      fonts:
        - asset: assets/fonts/jameel.ttf